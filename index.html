<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Picture of the Day</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section class="search-section">
            <h1>NASA Picture of the Day</h1>
            <p>Choose a date to see NASA's Astronomy Picture of the Day.</p>

            <input type="date">
            <button type="button">Get Picture</button>
        </section>

        <div class="separator"></div>

        <section class="picture-section">
            <h2>Picture Title</h2>
            <img src="" alt="NASA Astronomy Picture of the Day">
            <video src="" controls></video>
            <p id="description">Select a date to view the picture and its description.</p>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
