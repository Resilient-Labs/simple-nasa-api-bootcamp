<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="description" content="This is where your description goes">
		<meta name="keywords" content="one, two, three">

		<title>Daily NASA Picture (or Video) Picker</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>

	<body>
		<header>
			<h1>Daily NASA Picture (or Video) Picker</h1>
		</header>

		<main>
			<section>
				<input class="myDate" type="date" name="" value="">
				<button class="myButton" type="button" name="button">Show Me What You Got</button>
			</section>

			<section>
				<h2>NASA Picture (or Video) of Your Day</h2>
				<div id="facilityNamesAndWeather">
					<h3 class="myTitle"></h3>
					<img class="myImage" src="" alt="">
					<video class="myVideo" src="" controls></video>
					<h4 class="myExplanation"></h4>
				</div>
			</section>
		</main>

		<footer>
			<small>Made by: Niles</small>
		</footer>

		<script type="text/javascript" src="js/main.js"></script>
	</body>

</html>
